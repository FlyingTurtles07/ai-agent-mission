<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 비서 - 데이터 관리</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="topnav">
  <div class="brand">📊 AI 비서</div>
  <div class="nav-links">
    <a href="index.html">챗봇</a>
    <a href="data.html" class="active">데이터 관리</a>
    <a href="history.html">대화기록</a>
    <button id="themeToggle" class="theme-btn" type="button" aria-label="테마 전환"></button>
  </div>
</nav>

<main class="page-wrap">
  <h1>계약서 발송·서명 현황 데이터</h1>

  <h2>📌 데이터 요약</h2>
  <div id="summaryGrid" class="summary-grid"></div>

  <h2>📈 일별 추이 + 7일 이동평균</h2>
  <div class="chart-box"><canvas id="trendChart"></canvas></div>

  <div class="list-toolbar">
    <h2>데이터 목록</h2>
    <button id="exportBtn" class="btn-ghost" type="button">⬇ JSON 다운로드</button>
  </div>

  <form id="dataForm" class="data-form" style="margin-top:12px">
    <input type="hidden" id="editId">
    <input type="date" id="fDate" required>
    <input type="number" id="fValue" placeholder="신규계약 건수" required>
    <input type="text" id="fMemo" placeholder="메모">
    <button type="submit" class="btn-primary" id="submitBtn">등록</button>
    <button type="button" class="btn-ghost hidden" id="cancelEditBtn">취소</button>
  </form>

  <div id="dataTableWrap" class="table-wrap">
    <table id="dataTable">
      <thead>
        <tr><th>날짜</th><th>건수</th><th>메모</th><th>액션</th></tr>
      </thead>
      <tbody id="dataTbody"></tbody>
    </table>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
</body>
</html>
