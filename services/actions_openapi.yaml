openapi: 3.1.0
info:
  title: AI 비서 데이터 API
  description: 계약서 발송·서명 현황 데이터 요약/통계와 대화 기록을 읽기 전용으로 조회한다.
  version: 1.0.0
servers:
  - url: https://ai-agent-mission.onrender.com
paths:
  /api/data/summary:
    get:
      operationId: getDataSummary
      summary: 데이터 요약 조회 (기간, 개수, 평균, 최대/최소, 추세)
      responses:
        "200":
          description: 요약 정보
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/data/statistics:
    get:
      operationId: getDataStatistics
      summary: 일별 값과 7일 이동평균 시계열 조회
      responses:
        "200":
          description: 통계 정보
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/conversations:
    get:
      operationId: listConversations
      summary: 저장된 대화 목록 조회 (최신순)
      responses:
        "200":
          description: 대화 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/conversations/{id}:
    get:
      operationId: getConversation
      summary: 특정 대화의 전체 메시지 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 대화 상세
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true